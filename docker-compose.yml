# TaskFlow stack: PostgreSQL + Spring Boot API + nginx serving the React app.
#   cp .env.example .env   (then set the secrets)
#   docker compose up -d --build        -> http://localhost:8090
# For local development run only the database: docker compose up -d db  (exposed on localhost:5433).
name: taskflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:8090}
      APP_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8090}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # Optional extras (SMTP via SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD, APP_MAIL_FROM, ...).
    env_file:
      - path: ./backend.env
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  db-data:
