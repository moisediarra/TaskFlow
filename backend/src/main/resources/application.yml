spring:
  application:
    name: TaskFlow
  config:
    # Local secrets (DB credentials, JWT secret, bootstrap admin) live in backend/.env, which is git-ignored.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API documentation (Swagger UI at /swagger-ui.html) is for local development only.
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:false}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: ${APP_TIMEZONE:UTC}
  default-signup-role: ${APP_DEFAULT_SIGNUP_ROLE:PROJECT_OWNER}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  rate-limit-enabled: ${APP_RATE_LIMIT_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  password-reset:
    token-ttl: 30m
    # Without SMTP (SPRING_MAIL_HOST), print reset links to the log. Enable for local development only.
    log-links: ${APP_LOG_RESET_LINKS:false}
    mail-from: ${APP_MAIL_FROM:TaskFlow <no-reply@taskflow.local>}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:IT Manager}
  seed:
    demo: ${APP_SEED_DEMO:false}
    demo-password: ${APP_SEED_DEMO_PASSWORD:}
  workload:
    active-task-warning: 8
    overdue-task-warning: 3
  notifications:
    deadline-sweep-interval: 15m
