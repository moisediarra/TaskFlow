# Local development profile: activate with SPRING_PROFILES_ACTIVE=dev (set in backend/.env).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  password-reset:
    # Without SMTP configured, reset links are printed to the console (development only).
    log-links: true

logging:
  level:
    com.xdsdata.taskflow: DEBUG
